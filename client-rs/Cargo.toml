[package]
name = "client-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "net", "time", "signal", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = { version = "0.37.2", default-features = false, features = ["network","disk","system"] }
uuid = { version = "1.8", features = ["v4"] }
log = "0"
env_logger = "0.11"
anyhow = "1.0"
socket2 = "0.6.1"
if-addrs = "0.14.0"
once_cell = "1.19"
chrono = { version = "0.4", features = ["clock"] }
winreg = "0.55"
netstat2 = "0.11"
default-net = "0.22"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
