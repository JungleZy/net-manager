[package]
name = "client-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = { version = "0.37.2", features = ["network","disk","system"] }
uuid = { version = "1.8", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
socket2 = "0.6.1"
if-addrs = "0.14.0"
once_cell = "1.19"
chrono = { version = "0.4", features = ["clock"] }
