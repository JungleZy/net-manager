name: Test Then Build

on:
  push:
    tags:
      - 'v*' # 匹配所有以v开头的tag，例如 v1.0.0, v2.1.3
  workflow_dispatch: # 保留手动触发选项

jobs:
  test-windows:
    name: Test on Windows
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - architecture: x64
            runner: windows-latest
          - architecture: x86
            runner: windows-latest
          - architecture: arm64
            runner: windows-11-arm
        python-version: ['3.11']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Create logs directory
        run: |
          mkdir client\logs
        continue-on-error: true

      - name: Run tests with coverage
        run: |
          cd client
          python -m pytest -v --cov=src --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./client/coverage.xml
          flags: windows
          name: codecov-umbrella
        if: github.repository == 'your-username/net-manager' && github.event_name != 'pull_request'

  test-linux:
    name: Test on Linux
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - architecture: x64
            runner: ubuntu-latest
          - architecture: x86
            runner: ubuntu-latest
          - architecture: arm64
            runner: ubuntu-24.04-arm
        python-version: ['3.11']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Create logs directory
        run: |
          mkdir -p client/logs
        continue-on-error: true

      - name: Run tests with coverage
        run: |
          cd client
          python -m pytest -v --cov=src --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./client/coverage.xml
          flags: linux
          name: codecov-umbrella
        if: github.repository == 'your-username/net-manager' && github.event_name != 'pull_request'

  test-summary:
    name: Test Summary
    needs: [test-windows, test-linux]
    runs-on: ubuntu-latest
    steps:
      - name: All tests passed
        run: echo "All cross-platform tests completed successfully!"

  build-windows:
    name: Build for Windows
    needs: [test-summary] # 只有在测试成功完成后才执行打包
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - architecture: x64
            runner: windows-latest
          - architecture: x86
            runner: windows-latest
          - architecture: arm64
            runner: windows-11-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Python architecture
        shell: pwsh
        run: |
          python -c "import platform,sys;print(platform.machine());print(sys.maxsize)"

      - name: Get current date
        id: date
        run: |
          echo "date=$(Get-Date -Format 'yyyyMMdd')" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "nuitka>=2.7.0,<3.0.0"
          pip install -r requirements.txt

      - name: Build client for Windows (${{ matrix.architecture }})
        id: build
        shell: pwsh
        run: |
          cd client
          # 根据架构设置环境变量
          if ("${{ matrix.architecture }}" -eq "x86") {
            $outputName = "net-manager-client-win-x86.exe"
          } elseif ("${{ matrix.architecture }}" -eq "arm64") {
            $outputName = "net-manager-client-win-aarch64.exe"
          } else {
            $outputName = "net-manager-client-win-x64.exe"
          }

          # 使用Nuitka打包，添加--assume-yes-for-downloads参数避免交互式询问
          python -m nuitka `
            --standalone `
            --onefile `
            --output-filename="$outputName" `
            --windows-product-name="NetManagerClient" `
            --product-version="1.0.0" `
            --file-version="1.0.0" `
            --windows-console-mode=hide `
            --windows-uac-admin `
            --enable-plugin=multiprocessing `
            --follow-imports `
            --follow-stdlib `
            --include-package=src `
            --python-flag=-O `
            --lto=yes `
            --static-libpython=no `
            --assume-yes-for-downloads `
            --noinclude-unittest-mode=allow `
            --disable-ccache `
            main.py
            
          echo "outputName=$outputName" >> $env:GITHUB_OUTPUT

      - name: Cleanup Nuitka build directory (Windows)
        if: always()
        shell: pwsh
        run: |
          $distPath = "client/main.dist"
          if (Test-Path $distPath) {
            Write-Output "Attempting to remove $distPath"
            for ($i = 0; $i -lt 5; $i++) {
              try {
                Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $distPath
              } catch {}
              if (-not (Test-Path $distPath)) { break }
              Start-Sleep -Seconds 2
            }
            if (Test-Path $distPath) {
              Write-Output "Warning: $distPath still exists; skipping cleanup."
            } else {
              Write-Output "Removed $distPath successfully."
            }
          }
        continue-on-error: true

      - name: Verify binary architecture (Windows)
        shell: pwsh
        run: |
          $path = "client/${{ steps.build.outputs.outputName }}"
          $bytes = [System.IO.File]::ReadAllBytes($path)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          switch ($machine) { 0x8664 { $arch = "x64" } 0x014c { $arch = "x86" } 0xAA64 { $arch = "arm64" } default { $arch = "unknown" } }
          Write-Output "PE Machine=$([String]::Format('0x{0:X4}',$machine)) Arch=$arch"

      - name: Upload artifacts (Windows aarch64)
        if: matrix.architecture == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: net-manager-client-windows-aarch64
          path: client/${{ steps.build.outputs.outputName }}

      - name: Upload artifacts (Windows)
        if: matrix.architecture != 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: net-manager-client-windows-${{ matrix.architecture }}
          path: client/${{ steps.build.outputs.outputName }}

  build-linux:
    name: Build for Linux
    needs: [test-summary] # 只有在测试成功完成后才执行打包
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - architecture: x64
            runner: ubuntu-latest
          - architecture: x86
            runner: ubuntu-latest
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get current date
        id: date
        run: |
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
        shell: bash

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "nuitka>=2.7.0,<3.0.0"
          pip install -r requirements.txt

      - name: Install system dependencies (Linux x86)
        if: matrix.architecture == 'x86'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      - name: Install system dependencies (Linux arm64)
        if: matrix.architecture == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf

      - name: Build client for Linux (${{ matrix.architecture }})
        id: build
        run: |
          cd client

          # 根据架构设置编译选项
          if [ "${{ matrix.architecture }}" = "x86" ]; then
            export OUTPUT_NAME="net-manager-client-linux-x86"
          elif [ "${{ matrix.architecture }}" = "x64" ]; then
            export OUTPUT_NAME="net-manager-client-linux-x64"
          else
            export OUTPUT_NAME="net-manager-client-linux-aarch64"
          fi

          echo "outputName=$OUTPUT_NAME" >> $GITHUB_OUTPUT


          if [ "${{ matrix.architecture }}" = "arm64" ]; then
            IMAGE="quay.io/pypa/manylinux2014_aarch64"
            PY="/opt/python/cp311-cp311/bin/python3.11"
            docker run --rm \
              -v "$GITHUB_WORKSPACE:/work" -w /work/client "$IMAGE" \
              bash -lc "cd /opt/_internal && tar xf static-libs-for-embedding-only.tar.xz || true && \
                cd /work/client && \
                (command -v patchelf >/dev/null 2>&1 || yum -y install patchelf || true) && \
                $PY -m pip install --upgrade pip && \
                $PY -m pip install 'nuitka>=2.7.0,<3.0.0' -r /work/requirements.txt && \
                $PY -m nuitka \
                  --standalone \
                  --onefile \
                  --output-filename=\"$OUTPUT_NAME\" \
                  --product-version=\"1.0.0\" \
                  --file-version=\"1.0.0\" \
                  --enable-plugin=multiprocessing \
                  --follow-imports \
                  --follow-stdlib \
                  --include-package=src \
                  --python-flag=-O \
                  --static-libpython=yes \
                  --assume-yes-for-downloads \
                  --lto=no \
                  --noinclude-unittest-mode=allow \
                  --disable-ccache \
                  --no-pyi-file \
                  --show-progress \
                  --show-memory \
                  --jobs=2 \
                  --remove-output \
                  main.py && \
                chmod +x \"$OUTPUT_NAME\""
          elif [ "${{ matrix.architecture }}" = "x64" ]; then
            IMAGE="quay.io/pypa/manylinux2014_x86_64"
            PY="/opt/python/cp311-cp311/bin/python3.11"
            docker run --rm \
              -v "$GITHUB_WORKSPACE:/work" -w /work/client "$IMAGE" \
              bash -lc "cd /opt/_internal && tar xf static-libs-for-embedding-only.tar.xz || true && \
                cd /work/client && \
                (command -v patchelf >/dev/null 2>&1 || yum -y install patchelf || true) && \
                $PY -m pip install --upgrade pip && \
                $PY -m pip install 'nuitka>=2.7.0,<3.0.0' -r /work/requirements.txt && \
                $PY -m nuitka \
                  --standalone \
                  --onefile \
                  --output-filename=\"$OUTPUT_NAME\" \
                  --product-version=\"1.0.0\" \
                  --file-version=\"1.0.0\" \
                  --enable-plugin=multiprocessing \
                  --follow-imports \
                  --follow-stdlib \
                  --include-package=src \
                  --python-flag=-O \
                  --static-libpython=yes \
                  --assume-yes-for-downloads \
                  --lto=no \
                  --noinclude-unittest-mode=allow \
                  --disable-ccache \
                  --no-pyi-file \
                  --show-progress \
                  --show-memory \
                  --jobs=2 \
                  --remove-output \
                  main.py && \
                chmod +x \"$OUTPUT_NAME\""
          else
            IMAGE="quay.io/pypa/manylinux2014_i686"
            PY="/opt/python/cp311-cp311/bin/python3.11"
            docker run --rm \
              -v "$GITHUB_WORKSPACE:/work" -w /work/client "$IMAGE" \
              bash -lc "cd /opt/_internal && tar xf static-libs-for-embedding-only.tar.xz || true && \
                cd /work/client && \
                (command -v patchelf >/dev/null 2>&1 || yum -y install patchelf || true) && \
                $PY -m pip install --upgrade pip && \
                $PY -m pip install 'nuitka>=2.7.0,<3.0.0' -r /work/requirements.txt && \
                $PY -m nuitka \
                  --standalone \
                  --onefile \
                  --output-filename=\"$OUTPUT_NAME\" \
                  --product-version=\"1.0.0\" \
                  --file-version=\"1.0.0\" \
                  --enable-plugin=multiprocessing \
                  --follow-imports \
                  --follow-stdlib \
                  --include-package=src \
                  --python-flag=-O \
                  --static-libpython=yes \
                  --assume-yes-for-downloads \
                  --lto=no \
                  --noinclude-unittest-mode=allow \
                  --disable-ccache \
                  --no-pyi-file \
                  --show-progress \
                  --show-memory \
                  --jobs=2 \
                  --remove-output \
                  main.py && \
                chmod +x \"$OUTPUT_NAME\""
          fi

          chmod +x "$OUTPUT_NAME" || true

      - name: Verify binary architecture
        run: |
          uname -m
          file client/${{ steps.build.outputs.outputName }}
          readelf -h client/${{ steps.build.outputs.outputName }} | grep -E "Type:\s+EXEC" || (echo "Unexpected ELF Type (not EXEC)"; exit 1)
          echo "Checking GLIBC symbol requirements (must be <= 2.23)"
          if command -v objdump >/dev/null 2>&1; then
            max_glibc=$(objdump -p client/${{ steps.build.outputs.outputName }} | grep -o 'GLIBC_[0-9]\+\.[0-9]\+' | sort -V | tail -n1 || true)
          else
            max_glibc=$(strings client/${{ steps.build.outputs.outputName }} | grep -o 'GLIBC_[0-9]\+\.[0-9]\+' | sort -V | tail -n1 || true)
          fi
          echo "Max required GLIBC: ${max_glibc:-unknown}"
          if [ -n "$max_glibc" ]; then
            highest=$(printf "%s\n%s" "$max_glibc" "GLIBC_2.23" | sort -V | tail -n1)
            [ "$highest" = "GLIBC_2.23" ] || (echo "GLIBC requirement $max_glibc exceeds 2.23"; exit 1)
          fi

      - name: Upload artifacts (Linux aarch64)
        if: matrix.architecture == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: net-manager-client-linux-aarch64
          path: client/${{ steps.build.outputs.outputName }}

      - name: Upload artifacts (Linux)
        if: matrix.architecture != 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: net-manager-client-linux-${{ matrix.architecture }}
          path: client/${{ steps.build.outputs.outputName }}

  release:
    name: Create Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') # 只在tag推送时执行
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Display structure of downloaded files
        run: ls -R dist/

      - name: Get tag name
        id: tag
        run: |
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: false
          body: |
            ## 自动构建版本 ${{ steps.tag.outputs.tag }}

            ### 包含平台
            - Windows (x86, x64, aarch64)
            - Linux (x86, x64, aarch64)

            ### 下载说明
            请根据您的系统选择对应的可执行文件。
          files: |
            dist/net-manager-client-windows-x86/net-manager-client-win-x86.exe
            dist/net-manager-client-windows-x64/net-manager-client-win-x64.exe
            dist/net-manager-client-windows-aarch64/net-manager-client-win-aarch64.exe
            dist/net-manager-client-linux-x64/net-manager-client-linux-x64
            dist/net-manager-client-linux-x86/net-manager-client-linux-x86
            dist/net-manager-client-linux-aarch64/net-manager-client-linux-aarch64
