name: Test Then Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, ubuntu-24.04-arm]
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: |
          python -m unittest discover -s client/tests -p "test_*.py"
          python -m unittest discover -s server/tests -p "test_*.py"

  build-windows:
    needs: [test]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86
            runner: windows-latest
            pyarch: x86
          - arch: x64
            runner: windows-latest
            pyarch: x64
          - arch: aarch64
            runner: windows-11-arm
            pyarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.pyarch }}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build Client
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: client/main.py
          mode: app
          enable-plugins: multiprocessing
      - name: Rename Client Artifact
        shell: pwsh
        run: |
          if (Test-Path build/main.exe) { Move-Item build/main.exe build/net-manager-client-windows-${{ matrix.arch }}.exe }
      - uses: actions/upload-artifact@v4
        with:
          name: net-manager-client-windows-${{ matrix.arch }}
          path: build/net-manager-client-windows-${{ matrix.arch }}.exe
          include-hidden-files: true
      - name: Build Server
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: server/main.py
          mode: app
          enable-plugins: multiprocessing
      - name: Rename Server Artifact
        shell: pwsh
        run: |
          if (Test-Path build/main.exe) { Move-Item build/main.exe build/net-manager-server-windows-${{ matrix.arch }}.exe }
      - uses: actions/upload-artifact@v4
        with:
          name: net-manager-server-windows-${{ matrix.arch }}
          path: build/net-manager-server-windows-${{ matrix.arch }}.exe
          include-hidden-files: true

  build-linux:
    needs: [test]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
            setup_python: true
            container_image: ubuntu:24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
            setup_python: true
            container_image: ubuntu:24.04
          - arch: x86
            runner: ubuntu-latest
            setup_python: false
            container_image: i386/ubuntu:22.04
    container: ${{ matrix.container_image }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Python (x86)
        if: ${{ matrix.setup_python == false }}
        run: |
          apt-get update
          apt-get install -y python3 python3-pip gcc g++
      - name: Setup Python
        if: ${{ matrix.setup_python == true }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build Client
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: client/main.py
          mode: app
          enable-plugins: multiprocessing
      - name: Rename Client Artifact
        run: |
          if [ -f build/main ]; then mv build/main build/net-manager-client-linux-${{ matrix.arch }}; fi
          if [ -f build/main.bin ]; then mv build/main.bin build/net-manager-client-linux-${{ matrix.arch }}; fi
      - uses: actions/upload-artifact@v4
        with:
          name: net-manager-client-linux-${{ matrix.arch }}
          path: build/net-manager-client-linux-${{ matrix.arch }}
          include-hidden-files: true
      - name: Build Server
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: server/main.py
          mode: app
          enable-plugins: multiprocessing
      - name: Rename Server Artifact
        run: |
          if [ -f build/main ]; then mv build/main build/net-manager-server-linux-${{ matrix.arch }}; fi
          if [ -f build/main.bin ]; then mv build/main.bin build/net-manager-server-linux-${{ matrix.arch }}; fi
      - uses: actions/upload-artifact@v4
        with:
          name: net-manager-server-linux-${{ matrix.arch }}
          path: build/net-manager-server-linux-${{ matrix.arch }}
          include-hidden-files: true

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
      - run: ls -R dist/
      - id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: false
          body: |
            ## 自动构建版本 ${{ steps.tag.outputs.tag }}

            ### 包含平台
            - Windows (x86, x64, aarch64)
            - Linux (x86, x64, aarch64)

            ### 下载说明
            请根据您的系统选择对应的可执行文件。
          files: |
            dist/**
