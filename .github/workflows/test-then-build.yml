name: Test Then Build

on:
  push:
    tags:
      - 'v*' # 匹配所有以v开头的tag，例如 v1.0.0, v2.1.3
  workflow_dispatch: # 保留手动触发选项

jobs:
  test-windows:
    name: Test on Windows
    runs-on: windows-latest
    strategy:
      matrix:
        architecture: [x64, x86, arm]
        python-version: ['3.11']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Create logs directory
        run: |
          mkdir client\logs
        continue-on-error: true

      - name: Run tests with coverage
        run: |
          cd client
          python -m pytest -v --cov=src --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./client/coverage.xml
          flags: windows
          name: codecov-umbrella
        if: github.repository == 'your-username/net-manager' && github.event_name != 'pull_request'

  test-linux:
    name: Test on Linux
    runs-on: ubuntu-latest
    strategy:
      matrix:
        architecture: [x64, x86, arm, arm64]
        python-version: ['3.11']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Create logs directory
        run: |
          mkdir -p client/logs
        continue-on-error: true

      - name: Run tests with coverage
        run: |
          cd client
          python -m pytest -v --cov=src --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./client/coverage.xml
          flags: linux
          name: codecov-umbrella
        if: github.repository == 'your-username/net-manager' && github.event_name != 'pull_request'

  test-summary:
    name: Test Summary
    needs: [test-windows, test-linux]
    runs-on: ubuntu-latest
    if: always() # 确保即使测试失败也会执行
    steps:
      - name: Test Summary
        run: |
          echo "Cross-platform tests completed!"
          echo "Note: Build process will continue regardless of test results"

  build-windows:
    name: Build for Windows
    needs: [test-windows, test-linux] # 等待测试完成，但不要求成功
    if: always() # 确保即使测试失败也会执行
    runs-on: windows-latest
    strategy:
      matrix:
        architecture: [x64, x86, arm]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get current date
        id: date
        run: |
          echo "date=$(Get-Date -Format 'yyyyMMdd')" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "nuitka>=2.7.0,<3.0.0"
          pip install -r requirements.txt

      - name: Build client for Windows (${{ matrix.architecture }})
        id: build
        shell: pwsh
        run: |
          cd client
          # 根据架构设置环境变量
          if ("${{ matrix.architecture }}" -eq "x86") {
            $outputName = "net-manager-client-win-x86.exe"
          } else {
            $outputName = "net-manager-client-win-x64.exe"
          }

          # 使用Nuitka打包，添加--assume-yes-for-downloads参数避免交互式询问
          python -m nuitka `
            --standalone `
            --onefile `
            --output-filename="$outputName" `
            --windows-product-name="NetManagerClient" `
            --product-version="1.0.0" `
            --file-version="1.0.0" `
            --windows-console-mode=hide `
            --windows-uac-admin `
            --enable-plugin=multiprocessing `
            --follow-imports `
            --follow-stdlib `
            --include-package=src `
            --python-flag=-O `
            --lto=yes `
            --assume-yes-for-downloads `
            --static-libpython=no `
            --noinclude-unittest-mode=allow `
            --disable-ccache `
            --no-pyi-file `
            --remove-output `
            main.py
            
          # 设置输出变量供后续步骤使用
          echo "outputName=$outputName" >> $env:GITHUB_OUTPUT

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: net-manager-client-windows-${{ matrix.architecture }}
          path: client/${{ steps.build.outputs.outputName }}

  build-linux:
    name: Build for Linux
    needs: [test-windows, test-linux] # 等待测试完成，但不要求成功
    if: always() # 确保即使测试失败也会执行
    runs-on: ubuntu-latest
    strategy:
      matrix:
        architecture: [x64, x86, arm, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get current date
        id: date
        run: |
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
        shell: bash

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "nuitka>=2.7.0,<3.0.0"
          pip install -r requirements.txt

      - name: Install system dependencies (Linux x86)
        if: matrix.architecture == 'x86'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib
          # 安装旧版glibc开发包
          sudo apt-get install -y libc6-dev-i386

      - name: Install system dependencies (Linux ARM)
        if: matrix.architecture == 'arm' || matrix.architecture == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          if [ "${{ matrix.architecture }}" = "arm" ]; then
            sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
          fi

      - name: Build client for Linux (${{ matrix.architecture }})
        id: build
        run: |
          cd client

          # 根据架构设置编译选项
          if [ "${{ matrix.architecture }}" = "x86" ]; then
            export OUTPUT_NAME="net-manager-client-linux-x86"
            # 为x86架构设置特定的编译器标志，使用静态链接
            export CFLAGS="-m32 -static-libgcc -static-libstdc++"
            export CXXFLAGS="-m32 -static-libgcc -static-libstdc++"
            export LDFLAGS="-m32 -static-libgcc -static-libstdc++ -Wl,--as-needed"
          elif [ "${{ matrix.architecture }}" = "x64" ]; then
            export OUTPUT_NAME="net-manager-client-linux-x64"
            # 为x64架构设置静态链接标志
            export CFLAGS="-static-libgcc -static-libstdc++"
            export CXXFLAGS="-static-libgcc -static-libstdc++"
            export LDFLAGS="-static-libgcc -static-libstdc++ -Wl,--as-needed"
          elif [ "${{ matrix.architecture }}" = "arm" ]; then
            export OUTPUT_NAME="net-manager-client-linux-arm"
            # 为ARM架构设置静态链接标志
            export CFLAGS="-static-libgcc -static-libstdc++"
            export CXXFLAGS="-static-libgcc -static-libstdc++"
            export LDFLAGS="-static-libgcc -static-libstdc++ -Wl,--as-needed"
          else
            export OUTPUT_NAME="net-manager-client-linux-arm64"
            # 为ARM64架构设置静态链接标志
            export CFLAGS="-static-libgcc -static-libstdc++"
            export CXXFLAGS="-static-libgcc -static-libstdc++"
            export LDFLAGS="-static-libgcc -static-libstdc++ -Wl,--as-needed"
          fi

          # 设置输出变量供后续步骤使用
          echo "outputName=$OUTPUT_NAME" >> $GITHUB_OUTPUT

          # 使用Nuitka打包，所有架构都使用静态链接
          python -m nuitka \
            --standalone \
            --onefile \
            --output-filename="$OUTPUT_NAME" \
            --product-version="1.0.0" \
            --file-version="1.0.0" \
            --enable-plugin=multiprocessing \
            --follow-imports \
            --include-package=src \
            --python-flag=-O \
            --lto=no \
            --remove-output \
            --disable-ccache \
            --no-pyi-file \
            --static-libpython=no \
            --python-flag=no_site \
            --clang \
            main.py

      - name: Build Linux with Alpine for maximum compatibility
        run: |
          # 使用Alpine Linux容器构建静态链接的二进制文件，避免glibc版本依赖问题
          # 为所有架构构建Alpine版本，以确保最大兼容性

          if [ "${{ matrix.architecture }}" = "x86" ]; then
            ARCH_FLAG="i386"
            OUTPUT_SUFFIX="x86"
          elif [ "${{ matrix.architecture }}" = "x64" ]; then
            ARCH_FLAG="x86_64"
            OUTPUT_SUFFIX="x64"
          elif [ "${{ matrix.architecture }}" = "arm" ]; then
            ARCH_FLAG="armv7"
            OUTPUT_SUFFIX="arm"
          else
            ARCH_FLAG="aarch64"
            OUTPUT_SUFFIX="arm64"
          fi

          # 使用Alpine Linux容器构建静态链接的二进制文件
          docker run --rm -v $(pwd):/app -w /app \
            alpine:latest \
            sh -c "
              apk add --no-cache \
                python3 \
                py3-pip \
                gcc \
                g++ \
                musl-dev \
                linux-headers \
                libffi-dev \
                openssl-dev \
                && \
              python3 -m pip install --upgrade pip && \
              pip3 install 'nuitka>=2.7.0,<3.0.0' && \
              pip3 install -r requirements.txt && \
              cd client && \
              python3 -m nuitka \
                --standalone \
                --onefile \
                --output-filename='net-manager-client-linux-${OUTPUT_SUFFIX}' \
                --product-version='1.0.0' \
                --file-version='1.0.0' \
                --enable-plugin=multiprocessing \
                --follow-imports \
                --include-package=src \
                --python-flag=-O \
                --lto=no \
                --remove-output \
                --disable-ccache \
                --no-pyi-file \
                --static-libpython=no \
                --python-flag=no_site \
                main.py
            "

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: net-manager-client-linux-${{ matrix.architecture }}
          path: client/${{ steps.build.outputs.outputName }}

  release:
    name: Create Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/v') # 即使部分构建失败也尝试发布
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Display structure of downloaded files
        run: ls -R dist/

      - name: Get tag name
        id: tag
        run: |
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: false
          body: |
            ## 自动构建版本 ${{ steps.tag.outputs.tag }}

            ### 包含平台
            - Windows (x86, x64, ARM)
            - Linux (x86, x64, ARM, ARM64)

            ### 下载说明
            请根据您的系统选择对应的可执行文件。
          files: |
            dist/net-manager-client-windows-x86/net-manager-client-win-x86.exe
            dist/net-manager-client-windows-x64/net-manager-client-win-x64.exe
            dist/net-manager-client-linux-x86/net-manager-client-linux-x86
            dist/net-manager-client-linux-x64/net-manager-client-linux-x64
            dist/net-manager-client-linux-arm/net-manager-client-linux-arm
            dist/net-manager-client-linux-arm64/net-manager-client-linux-arm64
