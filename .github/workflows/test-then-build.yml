name: Test Then Build

on:
  push:
    tags:
      - 'v*' # 匹配所有以v开头的tag，例如 v1.0.0, v2.1.3
  workflow_dispatch: # 保留手动触发选项

jobs:
  test-windows:
    name: Test on Windows
    if: ${{ false }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - architecture: x64
            runner: windows-latest
          - architecture: x86
            runner: windows-latest
          - architecture: arm64
            runner: windows-11-arm
        python-version: ['3.11']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Create logs directory
        run: |
          mkdir client\logs
        continue-on-error: true

      - name: Run tests with coverage
        run: |
          cd client
          python -m pytest -v --cov=src --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./client/coverage.xml
          flags: windows
          name: codecov-umbrella
        if: github.repository == 'your-username/net-manager' && github.event_name != 'pull_request'

  test-linux:
    name: Test on Linux
    if: ${{ false }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - architecture: x64
            runner: ubuntu-latest
          - architecture: x86
            runner: ubuntu-latest
          - architecture: arm64
            runner: ubuntu-24.04-arm
        python-version: ['3.11']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Create logs directory
        run: |
          mkdir -p client/logs
        continue-on-error: true

      - name: Run tests with coverage
        run: |
          cd client
          python -m pytest -v --cov=src --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./client/coverage.xml
          flags: linux
          name: codecov-umbrella
        if: github.repository == 'your-username/net-manager' && github.event_name != 'pull_request'

  test-summary:
    name: Test Summary
    needs: [test-windows, test-linux]
    runs-on: ubuntu-latest
    steps:
      - name: All tests passed
        run: echo "All cross-platform tests completed successfully!"

  build-windows:
    name: Build for Windows

    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - architecture: x64
            runner: windows-latest
          - architecture: x86
            runner: windows-latest
          - architecture: arm64
            runner: windows-11-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies (Windows)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install "nuitka>=2.7.0,<3.0.0"
          pip install -r requirements.txt

      - name: Verify Python architecture
        shell: pwsh
        run: |
          python -c "import platform,sys;print(platform.machine());print(sys.maxsize)"

      - name: Get current date
        id: date
        run: |
          echo "date=$(Get-Date -Format 'yyyyMMdd')" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "nuitka>=2.7.0,<3.0.0"
          pip install -r requirements.txt

      - name: Build client for Windows (${{ matrix.architecture }})
        id: build
        shell: pwsh
        run: |
          cd client
          # 根据架构设置环境变量
          if ("${{ matrix.architecture }}" -eq "x86") {
            $outputName = "net-manager-client-win-x86.exe"
          } elseif ("${{ matrix.architecture }}" -eq "arm64") {
            $outputName = "net-manager-client-win-aarch64.exe"
          } else {
            $outputName = "net-manager-client-win-x64.exe"
          }

          # 使用Nuitka打包，添加--assume-yes-for-downloads参数避免交互式询问
          python -m nuitka `
            --standalone `
            --onefile `
            --output-filename="$outputName" `
            --windows-product-name="NetManagerClient" `
            --product-version="1.0.0" `
            --file-version="1.0.0" `
            --windows-console-mode=hide `
            --windows-uac-admin `
            --enable-plugin=multiprocessing `
            --follow-imports `
            --follow-stdlib `
            --include-package=src `
            --python-flag=-O `
            --lto=yes `
            --static-libpython=no `
            --assume-yes-for-downloads `
            --noinclude-unittest-mode=allow `
            --disable-ccache `
            main.py
            
          echo "outputName=$outputName" >> $env:GITHUB_OUTPUT

      - name: Cleanup Nuitka build directory (Windows)
        if: always()
        shell: pwsh
        run: |
          $distPath = "client/main.dist"
          if (Test-Path $distPath) {
            Write-Output "Attempting to remove $distPath"
            for ($i = 0; $i -lt 5; $i++) {
              try {
                Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $distPath
              } catch {}
              if (-not (Test-Path $distPath)) { break }
              Start-Sleep -Seconds 2
            }
            if (Test-Path $distPath) {
              Write-Output "Warning: $distPath still exists; skipping cleanup."
            } else {
              Write-Output "Removed $distPath successfully."
            }
          }
        continue-on-error: true

      - name: Verify binary architecture (Windows)
        shell: pwsh
        run: |
          $path = "client/${{ steps.build.outputs.outputName }}"
          $bytes = [System.IO.File]::ReadAllBytes($path)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          switch ($machine) { 0x8664 { $arch = "x64" } 0x014c { $arch = "x86" } 0xAA64 { $arch = "arm64" } default { $arch = "unknown" } }
          Write-Output "PE Machine=$([String]::Format('0x{0:X4}',$machine)) Arch=$arch"

      - name: Upload artifacts (Windows aarch64)
        if: matrix.architecture == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: net-manager-client-windows-aarch64
          path: client/${{ steps.build.outputs.outputName }}

      - name: Upload artifacts (Windows)
        if: matrix.architecture != 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: net-manager-client-windows-${{ matrix.architecture }}
          path: client/${{ steps.build.outputs.outputName }}

      - name: Setup Node.js (for Dashboard)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build dashboard (Windows)
        shell: pwsh
        run: |
          cd dashboard
          if (Test-Path node_modules) { Remove-Item -Recurse -Force node_modules }
          if (Test-Path package-lock.json) { Remove-Item -Force package-lock.json }
          npm install
          npm run build

      - name: Copy dashboard dist to server/static (Windows)
        shell: pwsh
        run: |
          if (Test-Path server\static) { Remove-Item -Recurse -Force server\static }
          New-Item -ItemType Directory -Force -Path server\static | Out-Null
          Copy-Item -Recurse -Force dashboard\dist\* server\static\

      - name: Build server for Windows (${{ matrix.architecture }})
        id: build_server
        shell: pwsh
        run: |
          cd server
          if ("${{ matrix.architecture }}" -eq "x86") {
            $serverName = "net-manager-server-win-x86.exe"
          } elseif ("${{ matrix.architecture }}" -eq "arm64") {
            $serverName = "net-manager-server-win-aarch64.exe"
          } else {
            $serverName = "net-manager-server-win-x64.exe"
          }

          python -m nuitka `
            --standalone `
            --output-filename="$serverName" `
            --windows-product-name="NetManagerServer" `
            --product-version="1.0.0" `
            --file-version="1.0.0" `
            --output-dir="../dist/server" `
            --windows-console-mode=force `
            --windows-uac-admin `
            --enable-plugin=multiprocessing `
            --follow-imports `
            --follow-stdlib `
            --include-package=src `
            --include-data-dir=static=static `
            --python-flag=-O `
            --lto=yes `
            --static-libpython=no `
            --assume-yes-for-downloads `
            --noinclude-unittest-mode=allow `
            --disable-ccache `
            main.py

          cd ../dist
          $ref = $env:GITHUB_REF
          $version = "1.0.0"
          if ($ref -match '^refs/tags/v(.+)$') { $version = $Matches[1] }
          elseif ($ref -match '^refs/tags/(.+)$') { $version = $Matches[1] }
          $zipName = "net-manager-server-$version-windows-${{ matrix.architecture }}.zip"
          if (Test-Path $zipName) { Remove-Item -Force $zipName }
          $distFolder = Get-ChildItem server -Directory | Where-Object { $_.Name -like '*.dist' } | Select-Object -First 1
          if ($null -eq $distFolder) { Write-Error "Server dist folder not found"; exit 1 }
          $agentDir = Join-Path $distFolder.FullName "static\agent"
          New-Item -ItemType Directory -Force -Path $agentDir | Out-Null
          $clientPath = Join-Path "..\client" "${{ steps.build.outputs.outputName }}"
          if (Test-Path $clientPath) { Copy-Item -Force $clientPath $agentDir }
          $targetName = "net-manager-server-$version"
          $targetPath = Join-Path $distFolder.Parent.FullName $targetName
          if (Test-Path $targetPath) { Remove-Item -Recurse -Force $targetPath }
          Move-Item $distFolder.FullName $targetPath
          Compress-Archive -Path $targetPath -DestinationPath $zipName
          echo "serverZip=$zipName" >> $env:GITHUB_OUTPUT

      - name: Upload artifacts (Server Windows)
        uses: actions/upload-artifact@v4
        with:
          name: net-manager-server-windows-${{ matrix.architecture }}
          path: dist/${{ steps.build_server.outputs.serverZip }}

  build-linux:
    name: Build for Linux

    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: ubuntu-latest
          - architecture: x86
            runner: ubuntu-latest
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get current date
        id: date
        run: |
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
        shell: bash

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "nuitka>=2.7.0,<3.0.0"
          pip install -r requirements.txt

      - name: Install system dependencies (Linux x86)
        if: matrix.architecture == 'x86'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      - name: Install system dependencies (Linux arm64)
        if: matrix.architecture == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf

      - name: Build client for Linux (${{ matrix.architecture }})
        id: build
        run: |
          cd client

          # 根据架构设置编译选项
          if [ "${{ matrix.architecture }}" = "x86" ]; then
            export OUTPUT_NAME="net-manager-client-linux-x86"
          elif [ "${{ matrix.architecture }}" = "x64" ]; then
            export OUTPUT_NAME="net-manager-client-linux-x64"
          else
            export OUTPUT_NAME="net-manager-client-linux-aarch64"
          fi

          echo "outputName=$OUTPUT_NAME" >> $GITHUB_OUTPUT


          if [ "${{ matrix.architecture }}" = "arm64" ]; then
            IMAGE="quay.io/pypa/manylinux2014_aarch64"
            PY="/opt/python/cp311-cp311/bin/python3.11"
            docker run --rm \
              -v "$GITHUB_WORKSPACE:/work" -w /work/client "$IMAGE" \
              bash -lc "cd /opt/_internal && tar xf static-libs-for-embedding-only.tar.xz || true && \
                cd /work/client && \
                (command -v patchelf >/dev/null 2>&1 || yum -y install patchelf || true) && \
                $PY -m pip install --upgrade pip && \
                $PY -m pip install 'nuitka>=2.7.0,<3.0.0' -r /work/requirements.txt && \
                $PY -m nuitka \
                  --standalone \
                  --onefile \
                  --output-filename=\"$OUTPUT_NAME\" \
                  --product-version=\"1.0.0\" \
                  --file-version=\"1.0.0\" \
                  --enable-plugin=multiprocessing \
                  --follow-imports \
                  --follow-stdlib \
                  --include-package=src \
                  --python-flag=-O \
                  --static-libpython=yes \
                  --assume-yes-for-downloads \
                  --lto=no \
                  --noinclude-unittest-mode=allow \
                  --disable-ccache \
                  --no-pyi-file \
                  --show-progress \
                  --show-memory \
                  --jobs=2 \
                  main.py && \
                chmod +x \"$OUTPUT_NAME\""
          elif [ "${{ matrix.architecture }}" = "x64" ]; then
            IMAGE="quay.io/pypa/manylinux2014_x86_64"
            PY="/opt/python/cp311-cp311/bin/python3.11"
            docker run --rm \
              -v "$GITHUB_WORKSPACE:/work" -w /work/client "$IMAGE" \
              bash -lc "cd /opt/_internal && tar xf static-libs-for-embedding-only.tar.xz || true && \
                cd /work/client && \
                (command -v patchelf >/dev/null 2>&1 || yum -y install patchelf || true) && \
                $PY -m pip install --upgrade pip && \
                $PY -m pip install 'nuitka>=2.7.0,<3.0.0' -r /work/requirements.txt && \
                $PY -m nuitka \
                  --standalone \
                  --onefile \
                  --output-filename=\"$OUTPUT_NAME\" \
                  --product-version=\"1.0.0\" \
                  --file-version=\"1.0.0\" \
                  --enable-plugin=multiprocessing \
                  --follow-imports \
                  --follow-stdlib \
                  --include-package=src \
                  --python-flag=-O \
                  --static-libpython=yes \
                  --assume-yes-for-downloads \
                  --lto=no \
                  --noinclude-unittest-mode=allow \
                  --disable-ccache \
                  --no-pyi-file \
                  --show-progress \
                  --show-memory \
                  --jobs=2 \
                  main.py && \
                chmod +x \"$OUTPUT_NAME\""
          else
            IMAGE="quay.io/pypa/manylinux2014_i686"
            PY="/opt/python/cp310-cp310/bin/python3.10"
            docker run --rm \
              -v "$GITHUB_WORKSPACE:/work" -w /work/client "$IMAGE" \
              bash -lc "cd /opt/_internal && tar xf static-libs-for-embedding-only.tar.xz || true && \
                cd /work/client && \
                (command -v patchelf >/dev/null 2>&1 || yum -y install patchelf || true) && \
                $PY -m pip install --upgrade pip && \
                $PY -m pip install 'nuitka>=2.7.0,<3.0.0' -r /work/requirements.txt && \
                $PY -m nuitka \
                  --standalone \
                  --onefile \
                  --output-filename=\"$OUTPUT_NAME\" \
                  --product-version=\"1.0.0\" \
                  --file-version=\"1.0.0\" \
                  --enable-plugin=multiprocessing \
                  --follow-imports \
                  --follow-stdlib \
                  --include-package=src \
                  --python-flag=-O \
                  --static-libpython=no \
                  --assume-yes-for-downloads \
                  --lto=no \
                  --noinclude-unittest-mode=allow \
                  --disable-ccache \
                  --no-pyi-file \
                  --show-progress \
                  --show-memory \
                  --jobs=2 \
                  main.py && \
                chmod +x \"$OUTPUT_NAME\""
          fi

          chmod +x "$OUTPUT_NAME" || true

      - name: Verify binary architecture
        run: |
          uname -m || true
          file client/${{ steps.build.outputs.outputName }} || true
          readelf -h client/${{ steps.build.outputs.outputName }} | grep -E "Type:\s+EXEC" || echo "Warning: Unexpected ELF Type"
          echo "Checking GLIBC symbol requirements (informational)"
          if command -v objdump >/dev/null 2>&1; then
            max_glibc=$(objdump -p client/${{ steps.build.outputs.outputName }} | grep -o 'GLIBC_[0-9]\+\.[0-9]\+' | sort -V | tail -n1 || true)
          else
            max_glibc=$(strings client/${{ steps.build.outputs.outputName }} | grep -o 'GLIBC_[0-9]\+\.[0-9]\+' | sort -V | tail -n1 || true)
          fi
          echo "Max required GLIBC: ${max_glibc:-unknown}"

      - name: Upload artifacts (Linux aarch64)
        if: matrix.architecture == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: net-manager-client-linux-aarch64
          path: client/${{ steps.build.outputs.outputName }}

      - name: Upload artifacts (Linux)
        if: matrix.architecture != 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: net-manager-client-linux-${{ matrix.architecture }}
          path: client/${{ steps.build.outputs.outputName }}

      - name: Setup Node.js (for Dashboard)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build dashboard (Linux)
        run: |
          cd dashboard
          rm -rf node_modules || true
          rm -f package-lock.json || true
          npm install
          npm run build

      - name: Copy dashboard dist to server/static (Linux)
        run: |
          rm -rf server/static || true
          mkdir -p server/static
          cp -r dashboard/dist/* server/static/
          # agent 不再复制到 static

      - name: Build server for Linux (${{ matrix.architecture }})
        id: build_server_linux
        run: |
          cd server
          if [ "${{ matrix.architecture }}" = "x86" ]; then
            SERVER_NAME="net-manager-server-linux-x86"
            IMAGE="quay.io/pypa/manylinux2014_i686"
          elif [ "${{ matrix.architecture }}" = "x64" ]; then
            SERVER_NAME="net-manager-server-linux-x64"
            IMAGE="quay.io/pypa/manylinux2014_x86_64"
          else
            SERVER_NAME="net-manager-server-linux-aarch64"
            IMAGE="quay.io/pypa/manylinux2014_aarch64"
          fi
          if [ "${{ matrix.architecture }}" = "x86" ]; then
            PY="/opt/python/cp310-cp310/bin/python3.10"
          else
            PY="/opt/python/cp311-cp311/bin/python3.11"
          fi
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" -w /work/server "$IMAGE" \
            bash -lc "cd /opt/_internal && tar xf static-libs-for-embedding-only.tar.xz || true && \
              cd /work/server && \
              (command -v patchelf >/dev/null 2>&1 || yum -y install patchelf || true) && \
              $PY -m pip install --upgrade pip && \
              $PY -m pip install 'nuitka>=2.7.0,<3.0.0' -r /work/requirements.txt && \
              $PY -m nuitka \
                --standalone \
                --output-filename=\"$SERVER_NAME\" \
                --product-version=\"1.0.0\" \
                --file-version=\"1.0.0\" \
                --output-dir=\"/work/dist/server\" \
                --enable-plugin=multiprocessing \
                --follow-imports \
                --follow-stdlib \
                --include-package=src \
                --include-data-dir=static=static \
                --python-flag=-O \
                --static-libpython=$( [ \"${{ matrix.architecture }}\" = \"x86\" ] && echo no || echo yes ) \
                --assume-yes-for-downloads \
                --lto=no \
                --noinclude-unittest-mode=allow \
                --disable-ccache \
                --no-pyi-file \
                --show-progress \
                --show-memory \
                --jobs=2 \
                main.py" && \
            true

          sudo chown -R $USER:$USER "$GITHUB_WORKSPACE/dist" || true
          cd ../dist
          version="${GITHUB_REF#refs/tags/}"
          version="${version#v}"
          folder=$(find server -maxdepth 1 -type d -name '*.dist' | head -n1)
          if [ -z "$folder" ]; then echo "Server dist folder not found"; exit 1; fi
          mkdir -p "$folder/static/agent"
          cp -f "../client/${{ steps.build.outputs.outputName }}" "$folder/static/agent/" || true
          target="server/net-manager-server-$version"
          rm -rf "$target" || true
          mv "$folder" "$target"
          TAR_NAME="net-manager-server-${version}-linux-${{ matrix.architecture }}.tar.gz"
          rm -f "$TAR_NAME" || true
          tar -czf "$TAR_NAME" -C server "net-manager-server-$version"
          echo "serverTar=$TAR_NAME" >> $GITHUB_OUTPUT

      - name: Upload artifacts (Server Linux)
        uses: actions/upload-artifact@v4
        with:
          name: net-manager-server-linux-${{ matrix.architecture }}
          path: dist/${{ steps.build_server_linux.outputs.serverTar }}

  package-server-windows:
    name: Package Server (Windows) with all clients
    needs: [build-windows, build-linux]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - architecture: x64
            runner: windows-latest
          - architecture: x86
            runner: windows-latest
          - architecture: arm64
            runner: windows-11-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download server artifact (Windows)
        uses: actions/download-artifact@v4
        with:
          name: net-manager-server-windows-${{ matrix.architecture }}
          path: temp_server

      - name: Download all client artifacts
        uses: actions/download-artifact@v4
        with:
          path: temp_clients
          pattern: net-manager-client-*

      - name: Repackage server with all clients (Windows)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          New-Item -ItemType Directory -Force -Path work_server | Out-Null
          $ref = $env:GITHUB_REF
          $version = "1.0.0"
          if ($ref -match '^refs/tags/v(.+)$') { $version = $Matches[1] } elseif ($ref -match '^refs/tags/(.+)$') { $version = $Matches[1] }
          $zipName = "net-manager-server-$version-windows-${{ matrix.architecture }}.zip"
          if (Test-Path $zipName) { Remove-Item -Force $zipName }
          $serverZip = Get-ChildItem temp_server -Recurse -Filter *.zip | Select-Object -First 1
          if ($null -eq $serverZip) { Write-Error "Server zip not found"; exit 1 }
          Expand-Archive -Path $serverZip.FullName -DestinationPath work_server -Force
          $distFolder = Get-ChildItem work_server -Directory | Where-Object { $_.Name -like '*.dist' -or $_.Name -like 'net-manager-server-*' } | Select-Object -First 1
          if ($null -eq $distFolder) { Write-Error "Server dist folder not found after extract"; exit 1 }
          $agentDir = Join-Path $distFolder.FullName "static\agent"
          New-Item -ItemType Directory -Force -Path $agentDir | Out-Null
          Get-ChildItem temp_clients -Recurse -File -Filter 'net-manager-client-*' | ForEach-Object {
            Copy-Item -Force $_.FullName $agentDir
          }
          $ref = $env:GITHUB_REF
          $version = "1.0.0"
          if ($ref -match '^refs/tags/v(.+)$') { $version = $Matches[1] } elseif ($ref -match '^refs/tags/(.+)$') { $version = $Matches[1] }
          if ($null -eq $distFolder) { Write-Error "Server dist folder not found"; exit 1 }
          $targetName = "net-manager-server-$version"
          if ($distFolder.Name -eq $targetName) {
            $targetPath = $distFolder.FullName
          } else {
            $targetPath = Join-Path $distFolder.Parent.FullName $targetName
            if (Test-Path $targetPath) { Remove-Item -Recurse -Force $targetPath }
            Move-Item $distFolder.FullName $targetPath
          }
          Compress-Archive -Path $targetPath -DestinationPath (Join-Path dist $zipName)

      - name: Upload server package (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: net-manager-server-windows-${{ matrix.architecture }}-allclients
          path: dist/net-manager-server-*-windows-${{ matrix.architecture }}.zip

  package-server-linux:
    name: Package Server (Linux) with all clients
    needs: [build-windows, build-linux]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - architecture: x64
            runner: ubuntu-latest
          - architecture: x86
            runner: ubuntu-latest
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download server artifact (Linux)
        uses: actions/download-artifact@v4
        with:
          name: net-manager-server-linux-${{ matrix.architecture }}
          path: temp_server

      - name: Download all client artifacts
        uses: actions/download-artifact@v4
        with:
          path: temp_clients
          pattern: net-manager-client-*

      - name: Repackage server with all clients (Linux)
        run: |
          mkdir -p dist work_server
          version="${GITHUB_REF#refs/tags/}"; version="${version#v}"
          serverTar=$(find temp_server -type f -name '*.tar.gz' | head -n1)
          [ -z "$serverTar" ] && echo "Server tar not found" && exit 1
          tar -xzf "$serverTar" -C work_server
          folder=$(find work_server -maxdepth 1 -type d -name '*.dist' -o -name 'net-manager-server-*' | head -n1)
          [ -z "$folder" ] && echo "Server dist folder not found after extract" && exit 1
          mkdir -p "$folder/static/agent"
          find temp_clients -maxdepth 2 -type f -name 'net-manager-client-*' -exec cp -f {} "$folder/static/agent/" \; || true
          true
          target="work_server/net-manager-server-$version"
          if [ "$(basename "$folder")" = "net-manager-server-$version" ]; then
            target="$folder"
          else
            rm -rf "$target" || true
            mv "$folder" "$target"
          fi
          TAR_NAME="dist/net-manager-server-${version}-linux-${{ matrix.architecture }}.tar.gz"; rm -f "$TAR_NAME" || true
          tar -czf "$TAR_NAME" -C "$(dirname "$target")" "$(basename "$target")"

      - name: Upload server package (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: net-manager-server-linux-${{ matrix.architecture }}-allclients
          path: dist/net-manager-server-*-linux-${{ matrix.architecture }}.tar.gz

  release:
    name: Create Release
    needs: [package-server-windows, package-server-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') # 只在tag推送时执行
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Display structure of downloaded files
        run: ls -R dist/

      - name: Get tag name
        id: tag
        run: |
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: false
          body: |
            ## 自动构建版本 ${{ steps.tag.outputs.tag }}

            ### 包含平台
            - Windows (x86, x64, aarch64)
            - Linux (x86, x64, aarch64)

            ### 下载说明
            请根据您的系统选择对应的可执行文件。
          files: |
            dist/net-manager-client-windows-x86/net-manager-client-win-x86.exe
            dist/net-manager-client-windows-x64/net-manager-client-win-x64.exe
            dist/net-manager-client-windows-aarch64/net-manager-client-win-aarch64.exe
            dist/net-manager-client-linux-x64/net-manager-client-linux-x64
            dist/net-manager-client-linux-x86/net-manager-client-linux-x86
            dist/net-manager-client-linux-aarch64/net-manager-client-linux-aarch64
            dist/net-manager-server-windows-x86-allclients/*.zip
            dist/net-manager-server-windows-x64-allclients/*.zip
            dist/net-manager-server-windows-arm64-allclients/*.zip
            dist/net-manager-server-linux-x64-allclients/*.tar.gz
            dist/net-manager-server-linux-x86-allclients/*.tar.gz
            dist/net-manager-server-linux-arm64-allclients/*.tar.gz
